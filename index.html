<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game KAFA</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🌙</text></svg>"/>
</head>
<body>

<!-- ══════════════════════════════
     HEADER
════════════════════════════════ -->
<header id="mainHeader">
  <a class="header-logo" href="#">
    <div class="logo-icon">🌙</div>
    <span>KAFA <em>GAME</em></span>
  </a>

  <button class="btn-keluar" id="btnKeluar" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Keluar
  </button>

  <!-- SUPPORT COFFEE SECTION -->
  <div class="support-btn-wrapper" id="coffeeBtnWrap">
    <div class="coffee-bubble" id="coffeeBubble">Suka web ini? Jom belanja saya kopi! ☕️</div>
    <a href="https://smart-nota.github.io/nota-digital/sokong-saya.html" class="coffee-btn" title="Sokong Kami" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="steam steam-1" d="M9 4C9 4 7.5 5.5 9 7C10.5 8.5 9 10 9 10"/>
        <path class="steam steam-2" d="M13 3C13 3 11.5 4.5 13 6C14.5 7.5 13 9 13 9"/>
        <path d="M18 10H4C2.89543 10 2 10.8954 2 12V15C2 18.3137 4.68629 21 8 21H14C17.3137 21 20 18.3137 20 15V12C20 10.8954 19.1046 10 18 10Z" fill="#FFFFFF"/>
        <path d="M20 12C20 12 22 12 22 14.5C22 17 20 17 20 17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </a>
  </div>
</header>

<!-- ══════════════════════════════
     MAIN
════════════════════════════════ -->
<main>

  <!-- ── LOGIN SCREEN ── -->
  <section id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <div class="big-icon">🌙</div>
        <h1>KAFA <span>GAME</span></h1>
        <p>Platform Pembelajaran Interaktif</p>
      </div>

      <div class="form-group">
        <label for="selKelas">📚 Pilih Kelas</label>
        <select id="selKelas">
          <option value="">-- Pilih Kelas --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="selPelajar">👤 Pilih Nama Pelajar</label>
        <select id="selPelajar" disabled>
          <option value="">-- Pilih Kelas Dahulu --</option>
        </select>
      </div>

      <button class="btn-masuk" id="btnMasuk">
        Masuk &nbsp;→
      </button>
    </div>
  </section>

  <!-- ── DASHBOARD (selepas login) ── -->
  <section id="welcomeSection">

    <!-- Welcome Card -->
    <div class="welcome-card">
      <div class="avatar" id="avatarWrap"></div>
      <div class="welcome-text">
        <div class="salam">Assalamualaikum,</div>
        <div class="nama" id="namaPelajar"></div>
        <div class="kelas" id="kelasPelajar"></div>
      </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="ujiminda">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44l-1.01-7.05A2.5 2.5 0 0 1 8.5 9.5H9.5V2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44l1.01-7.05A2.5 2.5 0 0 0 15.5 9.5H14.5V2Z"/></svg>
        Uji Minda
      </button>
      <button class="tab-btn" data-tab="ranking">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 0 0 5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 1 0 5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        Ranking
      </button>
    </div>

    <!-- ── TAB: UJI MINDA ── -->
    <div class="tab-content active" id="tabUjiminda">
      <div class="selector-row" id="ujimindaSubjekRow"></div>
      <div class="topic-grid" id="tajukGrid">
        <div class="empty-state"><div class="empty-icon">⏳</div><p>Memuatkan...</p></div>
      </div>
    </div>

    <!-- ── TAB: RANKING ── -->
    <div class="tab-content" id="tabRanking">
      <div class="selector-row" id="rankingSubjekRow"></div>
      <div class="selector-row" id="rankingTajukRow" style="margin-top:-4px"></div>
      <div id="rankingTableWrap">
        <div class="empty-state"><div class="empty-icon">🏆</div><p>Pilih subjek dan tajuk untuk lihat ranking.</p></div>
      </div>
    </div>

  </section>

</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  // Handle kembali dari game page dengan ranking redirect
  window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    const tab = params.get('tab');
    if (tab === 'ranking') {
      const nama    = params.get('nama');
      const kelas   = params.get('kelas');
      const subjek  = params.get('subjek');
      const topikId = params.get('topikId');
      if (nama && kelas) {
        // Auto-login dan tuju ke ranking
        currentUser = { nama, kelas, gender: getGender(nama) };
        document.getElementById('loginScreen').style.display = 'none';
        showDashboard();
        // Switch ke tab ranking
        setTimeout(() => {
          const rankBtn = document.querySelector('[data-tab="ranking"]');
          if (rankBtn) rankBtn.click();
        }, 300);
      }
    }
  });

  // Hide keluar btn on login screen (show only after login)
  const origShow = showDashboard;
  showDashboard = function() {
    document.getElementById('btnKeluar').style.display = 'flex';
    origShow();
  };
</script>
</body>
</html>
